<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Animated demo of a jobxhunter tailor run: coverage matrix, an independent recruiter score of 4.0 out of 5 with zero fabrications, and four real gaps surfaced rather than invented.">
  <title>jobxhunter — a real /tailor run</title>

  <!-- window -->
  <rect x="0" y="0" width="840" height="470" rx="12" fill="#0d1117"/>
  <rect x="0" y="0" width="840" height="40" rx="12" fill="#161b22"/>
  <rect x="0" y="28" width="840" height="12" fill="#161b22"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="6" fill="#27c93f"/>
  <text x="420" y="25" text-anchor="middle" font-size="13" fill="#6e7681">jobxhunter — never invents a fact</text>

  <!-- command -->
  <g opacity="0">
    <text x="24" y="80" font-size="16" fill="#8b949e">$ <tspan fill="#a371f7">/jobxhunter:tailor</tspan> <tspan fill="#c9d1d9">dump/dyson-farming_research-assistant.md</tspan></text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.029;0.05;1" values="0;0;1;1" calcMode="linear"/>
  </g>
  <rect x="640" y="68" width="9" height="16" fill="#a371f7">
    <animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.5;1"/>
  </rect>

  <!-- output lines -->
  <g opacity="0"><text x="24" y="120" font-size="15" fill="#58a6ff">▸ reading master profile … one source of truth</text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.093;0.11;1" values="0;0;1;1"/></g>

  <g opacity="0"><text x="24" y="150" font-size="15" fill="#8b949e">▸ coverage matrix — real profile vs job description</text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.15;0.17;1" values="0;0;1;1"/></g>

  <g opacity="0"><text x="48" y="178" font-size="15" fill="#c9d1d9">Degree in plant / crop science <tspan fill="#484f58">·········</tspan> <tspan fill="#3fb950" font-weight="bold">STRONG</tspan></text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.193;0.21;1" values="0;0;1;1"/></g>

  <g opacity="0"><text x="48" y="204" font-size="15" fill="#c9d1d9">Data collection &amp; record-keeping <tspan fill="#484f58">······</tspan> <tspan fill="#3fb950" font-weight="bold">STRONG</tspan></text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.236;0.256;1" values="0;0;1;1"/></g>

  <g opacity="0"><text x="48" y="230" font-size="15" fill="#c9d1d9">Full UK driving licence <tspan fill="#484f58">···········</tspan> <tspan fill="#d29922" font-weight="bold">PARTIAL</tspan>  <tspan fill="#6e7681">← surfaced, not faked</tspan></text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.279;0.299;1" values="0;0;1;1"/></g>

  <g opacity="0"><text x="24" y="270" font-size="15" fill="#58a6ff">▸ recruiter-critic (independent — sees only the JD + your CV) …</text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.343;0.363;1" values="0;0;1;1"/></g>

  <g opacity="0"><text x="48" y="296" font-size="15" fill="#8b949e">ATS 4.0 · six-second scan 4.5 · authenticity 4.5 · coverage 4.0</text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.393;0.413;1" values="0;0;1;1"/></g>

  <g opacity="0"><text x="48" y="326" font-size="17" fill="#c9d1d9">Overall <tspan fill="#a371f7" font-weight="bold" font-size="19">4.0 / 5</tspan>   ·   <tspan fill="#3fb950" font-weight="bold">0 fabrications</tspan></text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.45;0.47;1" values="0;0;1;1"/></g>

  <g opacity="0"><text x="24" y="366" font-size="15" fill="#d29922">▸ 4 real gaps flagged for you to answer — none invented.</text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.521;0.541;1" values="0;0;1;1"/></g>

  <g opacity="0"><text x="24" y="400" font-size="15" fill="#3fb950">✓ CV.docx + PDF filed · tracker row added · ready to submit</text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.586;0.606;1" values="0;0;1;1"/></g>

  <line x1="24" y1="424" x2="816" y2="424" stroke="#21262d" stroke-width="1"/>
  <text x="24" y="450" font-size="13" fill="#6e7681">Real output from the repo's own eval — <tspan fill="#8b949e">evals/2026-07-06-run/…/dyson-farming</tspan></text>
</svg>
