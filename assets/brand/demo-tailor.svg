<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 432" width="840" height="432" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A jobxhunter run: it sources live roles, fits the CV to a role marking each requirement FILLED, flags the one GAP to close, and scores 4.0 out of 5 from the independent recruiter with zero fabrications.">
  <title>jobxhunter: fits the job, flags the gaps</title>

  <rect x="0" y="0" width="840" height="432" rx="12" fill="#1a0000"/>
  <rect x="0" y="0" width="840" height="40" rx="12" fill="#2a0808"/>
  <rect x="0" y="28" width="840" height="12" fill="#2a0808"/>
  <circle cx="22" cy="20" r="6" fill="#e2564e"/>
  <circle cx="42" cy="20" r="6" fill="#8a3a34"/>
  <circle cx="62" cy="20" r="6" fill="#5a201c"/>
  <text x="420" y="25" text-anchor="middle" font-size="13" fill="#9a7d7a">jobxhunter &#183; fits the job, flags the gaps</text>

  <g opacity="0">
    <text x="24" y="80" font-size="16" fill="#9a7d7a">$ <tspan fill="#e2564e" font-weight="bold">jobxhunter hunt</tspan> <tspan fill="#f1efef">--uk</tspan></text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.029;0.05;1" values="0;0;1;1"/>
  </g>

  <g opacity="0"><text x="24" y="116" font-size="15" fill="#9a7d7a">&gt; sourced live roles &#183; Reed / Adzuna / Firecrawl</text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.086;0.106;1" values="0;0;1;1"/></g>

  <g opacity="0"><text x="24" y="146" font-size="15" fill="#9a7d7a">&gt; Research Assistant, Dyson Farming</text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.136;0.156;1" values="0;0;1;1"/></g>

  <g opacity="0"><text x="48" y="176" font-size="15" fill="#f1efef">Degree in plant science <tspan fill="#6a4a44">.......</tspan> <tspan font-weight="bold">FILLED</tspan></text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.179;0.199;1" values="0;0;1;1"/></g>

  <g opacity="0"><text x="48" y="204" font-size="15" fill="#f1efef">Data collection &amp; records <tspan fill="#6a4a44">....</tspan> <tspan font-weight="bold">FILLED</tspan></text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.214;0.234;1" values="0;0;1;1"/></g>

  <g opacity="0"><text x="48" y="232" font-size="15" fill="#f1efef">Full UK driving licence <tspan fill="#6a4a44">....</tspan> <tspan fill="#e2564e" font-weight="bold">GAP</tspan> <tspan fill="#9a7d7a">(recommend closing)</tspan></text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.257;0.277;1" values="0;0;1;1"/></g>

  <g opacity="0"><text x="24" y="270" font-size="15" fill="#9a7d7a">&gt; recruiter score <tspan fill="#e2564e" font-weight="bold" font-size="16">4.0 / 5</tspan> &#183; <tspan fill="#f1efef">0 fabrications</tspan></text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.314;0.334;1" values="0;0;1;1"/></g>

  <g opacity="0"><text x="24" y="304" font-size="15" fill="#e2564e">&gt; 4 real gaps flagged to close. None invented.</text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.364;0.384;1" values="0;0;1;1"/></g>

  <g opacity="0"><text x="24" y="338" font-size="15" fill="#f1efef">&#10003; CV filed &#183; gap-to-close roadmap written &#183; ready to send</text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.414;0.434;1" values="0;0;1;1"/></g>

  <line x1="24" y1="366" x2="816" y2="366" stroke="#3a1512" stroke-width="1"/>
  <text x="24" y="392" font-size="13" fill="#9a7d7a">Real output from the repo's own eval &#183; <tspan fill="#c9b2af">evals/2026-07-06-run/&#8230;/dyson-farming</tspan></text>
</svg>
